# warehouse-supply-chain — Warehouse / Supply-Chain Fulfilment Pod
#
# A pod of digital employees + humanoid actors + two human roles that runs an
# outbound order end to end: order -> allocate + travel-minimised route ->
# reserve stock -> pick (humanoid) -> inspect -> pack -> rate-shop carrier ->
# DISPATCH (finisher, behind a release gate) -> load -> ship. Plus the standing
# supply-chain roles: cycle-count / shrink control, returns, replenishment,
# supplier relations, and humanoid-fleet telemetry.
#
# The pod is a TEAM, not a pipeline. There is a COORDINATOR that owns the order
# and is the single point of contact; SPECIALISTS that each do one job; a
# FINISHER (shipment_dispatcher) that re-checks a release token, enforces
# deterministic invariants, renders the real shipping manifest to ./out, and
# fails closed (delete-on-block); first-class HUMAN members answering in Studio's
# Inbox — nothing is released or approved on their silence; and the Manager as
# SUPERVISOR.
# Systems of record (WMS / TMS / ERP / fleet API) are TOOLS inside agents —
# commented mcp blocks + dev-store fallbacks that announce themselves — never
# members. Every wire is conditional; silence never advances anything.
#
# Design doctrine: claude_skills/leafmesh/building-agents-thoroughly.md
# Field reference:  claude_skills/leafmesh/agent-config-fields.md
# Gotchas:          claude_skills/leafmesh/nuances-and-gotchas.md

name: "warehouse-supply-chain"
version: "1.0.0"
architecture: "managed_mesh"
environment: "development"
debug: true
log_level: "INFO"

auto_discover:
  directory: "./agency"
  pattern: "*_agent.py"
  recursive: false

# The Manager is the SUPERVISOR, not a router in the middle of the team (static
# routing). It escalates to the Warehouse Manager (the accountable human) on a
# non-retryable error (auth / bad request / credit / bad config), when 3
# different agents fail in one order (max_errors_per_session), or when restarts
# run out. A malformed hand-off only alerts. A question nobody answers is NOT
# escalated: the card closes and the ticket records that no reply came. Floor
# exceptions, shrink and the dispatch release reach people via can_call wires.
manager:
  model: "gpt-4o-mini"
  domain: "generic"
  prompt: |
    This mesh runs warehouse outbound fulfilment. A successful order flows
    coordinator -> allocation (pick path + travel-minimised route + availability
    gate) -> inventory (reserve) -> picker (humanoid) -> inspection -> packer ->
    carrier rate-shop -> shipment_dispatcher (release gate + manifest) -> loader.
    Standing roles run alongside: cycle-count / shrink control, returns,
    replenishment, supplier relations, humanoid-fleet telemetry.

    The team's own wires send safety / damage / high-value exceptions to the
    Ops Supervisor, and systematic cycle-count shrink and a carton worth $500
    or more to the Warehouse Manager. You escalate to the Warehouse Manager
    when agents keep failing. Silence never advances an order.
  routing:
    mode: static
  escalation:
    targets:
      - type: "human_agent"
        agent: "warehouse_manager_human"
      # Webhook escalation (e.g. PagerDuty): create the vault connection
      # 'escalation_webhook' (an "Add custom" record on the Infrastructure
      # page, service type 'Outbound webhook'), then uncomment — here before the
      # first start, in Studio's YAML editor after it (applies live, no restart).
      # - type: "webhook"
        # connection: escalation_webhook   # vault connection holds the URL + headers
        # method: "POST"
        # payload_template:
          # incident_id: "{{order_id}}"
          # severity: "{{severity}}"
          # message: "{{message}}"
          # session_id: "{{session_id}}"
    auto_escalate:
      max_retries: 2
      max_errors_per_session: 3

# 2.4.131 runtime block — proof/plan-heavy agents (the supplier super-agent, the
# coordinator) can run long. The 2.4.131 default dropped to 90s; raise it. NOTE:
# the `timeouts` block is REJECTED by <=2.4.130 — it must ship WITH the 2.4.131
# floor in requirements.txt, never before.
timeouts:
  mesh_call_default_timeout_s: 120
  llm_hard_timeout_s: 300

# Event listeners (BRD-021) — the coordinator also wakes on order events written
# to a Redis stream by the OMS. Redis Streams uses the core redis dep (no extra).
# Distinct from the SDK's primary Redis above; the stream's address lives in
# the vault connection 'order_events' (never here).
# brokers:
  # Day 0 this broker is off: create the vault connection 'order_events' on
  # Infrastructure → Brokers & queues → Redis Streams, then uncomment it and
  # its agents' listen_events — here before the first start, in Studio's YAML
  # editor after it (applies live, no restart).
  # order_events:
    # type: redis_streams
    # connection: order_events   # vault connection (Infrastructure → Brokers & queues → Redis Streams) holds the address
    # db: 1

data_structures:
  OrderEvent:
    type: "object"
    properties:
      order_id: { type: "string" }
      customer_id: { type: "string" }
      line_items: { type: "list" }       # [{sku, quantity}]
      ship_to: { type: "object" }
      ship_method: { type: "string" }
      received_at_utc: { type: "string" }
    required: ["order_id", "line_items"]

# ── Entry points — one per real-world trigger. Multiple entries; no single
#    funnel. (Direct-call entries stay for debugging / programmatic ingest.) ──
entry_points:
  - name: "order_placed"
    target: "fulfillment_coordinator_agent"
    description: "OMS order webhook — the Coordinator opens the order."
    condition: always
  - name: "order_status"
    target: "fulfillment_coordinator_agent"
    description: "Anyone asks 'where is my order?' — the Coordinator answers from the record."
    condition: always
  - name: "manual_action"
    target: "fulfillment_coordinator_agent"
    description: "Operator-triggered action routed through the Coordinator."
    condition: always
  - name: "return_received"
    target: "returns_handler_agent"
    description: "A returned item arrives at the warehouse."
    condition: always
  - name: "restock_event"
    target: "inventory_agent"
    description: "Inbound restock — update inventory."
    condition: always
  - name: "cycle_count_scheduled"
    target: "inventory_control_agent"
    description: "Nightly cycle-count sweep (mode: count) — fans out across zones."
    condition: always
  - name: "cycle_count_ingest"
    target: "inventory_control_agent"
    description: "Record one physical-count result (mode: ingest)."
    condition: always
  - name: "inventory_recon"
    target: "inventory_control_agent"
    description: "Reconcile physical vs system; flag systematic shrink (mode: report)."
    condition: always
  - name: "reorder_sweep"
    target: "replenishment_planner_agent"
    description: "Sweep all SKUs and surface reorder recommendations."
    condition: always
  - name: "sku_master_update"
    target: "replenishment_planner_agent"
    description: "Set / adjust one SKU's on-hand qty / reorder thresholds."
    condition: always
  - name: "carrier_select"
    target: "carrier_selector_agent"
    description: "Packed carton ready — pick the cheapest carrier meeting SLA."
    condition: always
  - name: "carrier_outage_failover"
    target: "carrier_selector_agent"
    description: "Primary carrier outage — fail over to next-cheapest meeting SLA."
    condition: always
  - name: "humanoid_status"
    target: "humanoid_status_agent"
    description: "Humanoid telemetry event (battery / fault / location)."
    condition: always
  - name: "supplier_relations_onboarding"
    target: "supplier_relations_agent"
    description: "Update / approve a supplier's onboarding state (mode: onboarding)."
    condition: always
  - name: "supplier_relations_sourcing"
    target: "supplier_relations_agent"
    description: "Find qualified alternates for a SKU / category (mode: sourcing)."
    condition: always
  - name: "supplier_quarterly_scorecard"
    target: "supplier_relations_agent"
    description: "Quarterly scorecard aggregation across all suppliers (mode: scorecard)."
    condition: always
  - name: "release_reply"
    target: "warehouse_manager_human"
    description: "HITL resume — the Warehouse Manager authorises (or holds) a dispatch release."
    condition: always
  - name: "supervisor_reply"
    target: "ops_supervisor_human"
    description: "HITL resume — the Ops Supervisor answers a floor exception."
    condition: always
  # Direct-call entries — every non-human, non-terminal agent is API-addressable
  # (bypasses the upstream chain) for ad-hoc invocation / debugging.
  - name: "direct_call_allocation"
    target: "allocation_agent"
    description: "On-demand direct call to allocation (also computes the pick route)."
    condition: always
  - name: "direct_call_exception"
    target: "exception_agent"
    description: "On-demand direct call to the exception handler."
    condition: always
  - name: "direct_call_dispatch"
    target: "shipment_dispatcher_agent"
    description: "On-demand direct call to the shipment dispatcher (finisher)."
    condition: always

agents:

  # ═════════════════════════════════════════════════════════════════════════
  # COORDINATOR — Fulfilment Coordinator (AI). Owns the order end to end: opens
  # it, orchestrates the pod, keeps live status, is the one contact. Pure
  # orchestration — never allocates, picks, packs, or authorises a release.
  # Pure-YAML LLM (no module): the raw model produces the yields contract.
  # ═════════════════════════════════════════════════════════════════════════
  fulfillment_coordinator_agent:
    name: "fulfillment_coordinator_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.1
    description: "Fulfilment Coordinator — opens the order, orchestrates, keeps status, single point of contact."
    prompt: |
      You are the Fulfilment Coordinator. You OWN each outbound order from the
      moment it arrives to the moment it ships. You orchestrate the pod and keep
      the requester informed — you never allocate stock, pick, pack, select a
      carrier, or authorise a release yourself.

      On a new order: open it, record the received time, hand it to allocation.
      On a status ask: answer current stage / waiting-on / next gate from the
      order record — nothing invented. Route any specialist's blocking exception
      to the Warehouse Manager; never make the floor call yourself. When the Ops
      Supervisor escalates a floor exception to you (human_message "escalate"),
      your action is escalate — the Warehouse Manager takes it from there.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"action": ..., "order_id": ..., "stage": ..., "waiting_on": ..., "summary": ...}
    yields:
      action: "string"        # open_order | status | escalate
      order_id: "string"
      stage: "string"
      waiting_on: "string"
      summary: "string"
    inputs:
      order: "object"
      order_id: "string"
      message: "string"
      human_message: "string"   # an Ops Supervisor escalation arrives here
    # Order events (BRD-021) — the OMS writes order.created events to a Redis
    # stream; the Coordinator consumes them in parallel with the webhook entry.
    # listen_events:
      # - broker: order_events
        # stream: "orders.created"
        # consumer_group: "fulfillment-coordinator"
        # batch_size: 10
    can_call:
      - agent: "allocation_agent"
        condition: "calling_agent_response.action == 'open_order'"
      - agent: "warehouse_manager_human"
        condition: "calling_agent_response.action == 'escalate'"

  # ═════════════════════════════════════════════════════════════════════════
  # allocation_agent — pick path + batching + priority + travel-minimised route
  # in one programmatic step, with the deterministic AVAILABILITY GATE (@chain,
  # agency/_shared/allocation_math). A short order surfaces as a short-pick
  # exception and the picker is NOT dispatched. See agency/allocation_agent.py.
  # ═════════════════════════════════════════════════════════════════════════
  allocation_agent:
    name: "allocation_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Pick path, batching, priority + travel-minimised route; deterministic availability gate."
    yields:
      pick_plan: "list"                  # [{sku, qty, zone, bin}]
      batch_id: "string"
      priority: "string"                 # standard | rush | hazmat
      requires_special_handling: "boolean"
      pick_sequence: "list"              # ordered [{bin, sku, qty}]
      estimated_minutes: "number"
      assigned_resource: "string"        # picker_humanoid | human_picker | "" (gated)
      order_id: "string"
      all_available: "boolean"           # @chain availability gate verdict
      short_lines: "list"                # [{sku, requested, available}] — gated lines
    inputs:
      order: "object"
      order_id: "string"
      pick_plan: "list"
    can_call:
      - agent: "inventory_agent"
        condition: "calling_agent_response.all_available == true"
      - agent: "exception_agent"
        condition: "calling_agent_response.all_available == false"
      - agent: "picker_humanoid"
        condition: "calling_agent_response.assigned_resource == 'picker_humanoid' and calling_agent_response.all_available == true"
      - agent: "warehouse_manager_human"
        condition: "calling_agent_response.assigned_resource == 'human_picker' and calling_agent_response.all_available == true"

  # ─────────────────────────────────────────────────────────────────────────
  # inventory_agent — confirms stock + reserves units. Store-grounded day-0
  # (agency/inventory_agent.py reserves against the seeded WMS and announces
  # available:false when a SKU is unknown); wire the WMS by uncommenting its
  # integration: mcp block (here before the first start, Studio's YAML editor after).
  # ─────────────────────────────────────────────────────────────────────────
  inventory_agent:
    name: "inventory_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Confirms stock + reserves units in your WMS (store-grounded day-0)."
    yields:
      all_in_stock: "boolean"
      short_skus: "list"                 # [{sku, requested, available}]
      reservation_id: "string"
      available: "boolean"               # dev-store fallback announces itself
    inputs:
      pick_plan: "list"
      payload: "object"
    # ── To wire the real WMS: create the vault connection 'wms_mcp' on
    #    Infrastructure → Integrations → MCP (or an "Add custom" record, service
    #    type Tools, base URL = the MCP server's address; its token lives
    #    there too, never here), then uncomment — here before the first start,
    #    in Studio's YAML editor after it. The same connection serves every WMS block
    #    below. Until then the dev-store body answers. ──
    # A programmatic agent takes its connector as `integration:` +
    # `connector_config:` (an `mcp:` list is refused on agent_type
    # programmatic). The connector's response is handed to this agent's
    # Python body as its first argument — adapt the body before uncommenting.
    # integration: mcp
    # connector_config:
    #   connection: wms_mcp   # vault connection holds the URL + token
    #   transport: http
    #   tool_name: check_and_reserve_stock
    #   timeout: 30
    can_call:
      - agent: "exception_agent"
        condition: "calling_agent_response.all_in_stock == false"
      - agent: "warehouse_audit_logger_agent"
        condition: "calling_agent_response.all_in_stock == true"

  # ═════════════════════════════════════════════════════════════════════════
  # exception_agent — short-pick / damage / wrong-item / safety handler (DEEP
  # LLM). @pre_compose pulls the order + affected SKU value + fleet unit BEFORE
  # the model classifies; @chain enforce_severity_floor re-asserts the floors a
  # prompt can't waive (safety / any damage / high-value >= $500 -> supervisor +
  # escalate). Playbook = the triage craft, fetched on demand. The wires gate on
  # the SAME verdict. See agency/exception_agent.py.
  # ═════════════════════════════════════════════════════════════════════════
  exception_agent:
    name: "exception_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.1
    max_tokens: 800
    description: "Short-pick / damage / wrong-item / safety handler; deterministic severity/safety floor."
    prompt: |
      You are the warehouse exception handler. Classify the floor exception you
      are handed and recommend the first action — you never resolve a safety,
      damage, or high-value event yourself; those go to the Ops Supervisor.

      Classify exactly one exception_type (short_pick | damage | wrong_item |
      safety; if genuinely ambiguous, short_pick), score severity 0..1, and pick
      a recommended_action (substitute_sku | backorder | refund | escalate).
      Write a 2-3 sentence supervisor_briefing optimised for a fast read on a
      tablet on the floor — lead with type + severity, name the SKU/order, and
      recommend the first action. Echo order_id unchanged. Leave floor_reason ""
      — it is OWNED by the deterministic severity floor, never you.

      Load the `exception_triage` playbook for how to classify and brief well.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"exception_type": "", "severity": 0, "recommended_action": "", "requires_supervisor": false, "supervisor_briefing": "", "order_id": "", "floor_reason": ""}
    playbook:
      - intent: exception_triage
        description: "How to classify a warehouse exception and brief the supervisor."
        responsibility: |
          1. Read the pulled context FIRST — the order, the affected SKU's unit
             value and free stock, and the fleet unit behind the event. Reason
             over facts, not the one-line note the caller pasted in.
          2. A safety event is always severity 1.0, requires_supervisor, escalate.
             Any damage is never front-line-resolvable — escalate. A short/damage
             on a $500+ line escalates regardless of your score.
          3. Below 0.7, non-safety, non-damage, not high-value: front-line
             resolvable — substitute_sku or backorder, requires_supervisor false.
          4. The briefing is read on the floor: type + severity first, then the
             SKU/order, then the action. Never empty.
        variables: [order_id, sku]
    narration: >
      If the briefing suggests a chronic pattern (the same zone, SKU or picker
      recurring across recent exceptions), consider warehouse_manager_human in
      addition to the supervisor. If the damage clearly originates with inbound
      supplier goods rather than warehouse handling, consider
      supplier_relations_agent.
    enforce_yields: true
    enforce_yields_retry: 2
    yields:
      exception_type: "string"
      severity: "number"
      recommended_action: "string"
      requires_supervisor: "boolean"
      supervisor_briefing: "string"
      order_id: "string"
      floor_reason: "string"             # @chain severity floor — why it escalated
    inputs:
      upstream_yields: "object"
      order_id: "string"
      sku: "string"
      unit_id: "string"
    can_call:
      - agent: "ops_supervisor_human"
        condition: "calling_agent_response.requires_supervisor == true or calling_agent_response.severity >= 0.7 or calling_agent_response.exception_type == 'safety'"
      - agent: "warehouse_audit_logger_agent"
        condition: "calling_agent_response.severity < 0.7 and calling_agent_response.requires_supervisor == false and calling_agent_response.exception_type != 'safety'"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # picker_humanoid — physical pick from bins (humanoid fleet dispatcher).
  # @pre_compose reserves a ready fleet unit; the actuator is idempotent via the
  # session stash so a re-entered chain never double-dispatches a pick.
  # ─────────────────────────────────────────────────────────────────────────
  picker_humanoid:
    name: "picker_humanoid"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Humanoid picker — physical pick from bins (projected $3-8/hr)."
    yields:
      pick_status: "string"              # picked | short | damaged | aborted
      picked_units: "number"
      damage_flag: "boolean"
      picker_id: "string"
    inputs:
      pick_sequence: "list"
      assigned_resource: "string"
    can_call:
      - agent: "inspection_humanoid"
        condition: "calling_agent_response.damage_flag == true"
      - agent: "exception_agent"
        condition: "calling_agent_response.pick_status != 'picked'"
      - agent: "packer_humanoid"
        condition: "calling_agent_response.pick_status == 'picked'"

  inspection_humanoid:
    name: "inspection_humanoid"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Humanoid inspector — verifies condition of flagged items."
    yields:
      inspection_result: "string"        # pass | fail | indeterminate
      condition_notes: "list"
      safe_to_ship: "boolean"
    inputs:
      pick_status: "string"
    can_call:
      - agent: "packer_humanoid"
        condition: "calling_agent_response.safe_to_ship == true"
      - agent: "exception_agent"
        condition: "calling_agent_response.safe_to_ship == false"

  # packer_humanoid — packs into a shipping carton. @chain enforce_ship_ready:
  # a carton is only ship-ready when units were packed and the weight is known.
  packer_humanoid:
    name: "packer_humanoid"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Humanoid packer — packs picked items into a shipping carton; ship-readiness floor."
    yields:
      carton_id: "string"
      weight_kg: "number"
      packed: "boolean"
    inputs:
      picked_units: "number"
      order_id: "string"
    can_call:
      - agent: "carrier_selector_agent"
        condition: "calling_agent_response.packed == true"

  # carrier_selector_agent — cheapest carrier meeting the SLA (deterministic
  # rate-shop floor, agency/_shared/carrier_math). A carton with no SLA-meeting
  # carrier raises an exception instead of shipping late.
  carrier_selector_agent:
    name: "carrier_selector_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Picks the cheapest carrier meeting the SLA (store-grounded rate-shop floor)."
    yields:
      selected_carrier: "string"        # ups | fedex | usps | dhl | regional
      service_level: "string"           # ground | 2day | overnight | priority
      estimated_cost_cents: "number"
      sla_met: "boolean"
      savings_vs_default_cents: "number"
      rationale: "string"
      tracking_number_placeholder: "string"
      carton_id: "string"
    inputs:
      carton_id: "string"
      weight_kg: "number"
      destination: "object"
      sla_days: "number"
      carrier_down: "string"            # failover: this carrier is excluded
    # ── Wire the real TMS: create the vault connection 'tms_mcp' on
    #    Infrastructure → Integrations → MCP (or an "Add custom" record, service
    #    type Tools), then uncomment — here before the first start, in Studio's
    #    YAML editor after it (applies live, no restart). ──
    # A programmatic agent takes its connector as `integration:` +
    # `connector_config:` (an `mcp:` list is refused on agent_type
    # programmatic). The connector's response is handed to this agent's
    # Python body as its first argument — adapt the body before uncommenting.
    # integration: mcp
    # connector_config:
    #   connection: tms_mcp   # vault connection holds the URL + token
    #   transport: http
    #   tool_name: select_carrier
    #   timeout: 30
    can_call:
      - agent: "shipment_dispatcher_agent"
        condition: "calling_agent_response.sla_met == true"
      - agent: "exception_agent"
        condition: "calling_agent_response.sla_met == false"

  # ═════════════════════════════════════════════════════════════════════════
  # shipment_dispatcher_agent — the FINISHER / actuator. It sits BEHIND the
  # dispatch RELEASE gate. It never releases a carton on its own authority:
  #   a) RELEASE re-check — reaching this agent is not authorisation. Routine
  #      cartons self-authorise on deterministic invariants; a HELD / high-value
  #      carton routes to the Warehouse Manager, and phase 2 issues ONLY on an
  #      explicit release token (allowlist), an UNKNOWN verdict failing closed.
  #   b) deterministic invariants a human can't waive (carrier selected, SLA
  #      met, a real carton with weight).
  #   c) render the real shipping MANIFEST to ./out; on a tripped floor, DELETE
  #      the partial and record status: blocked — never a half-issued shipment.
  #   d) dev-store fallback that ANNOUNCES itself (available:false) when there is
  #      no shipment record — never a synthetic dispatch ack.
  # See agency/shipment_dispatcher_agent.py.
  # ═════════════════════════════════════════════════════════════════════════
  shipment_dispatcher_agent:
    name: "shipment_dispatcher_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Dispatch finisher — release re-check, invariants, renders the shipping manifest, WORM ledger."
    yields:
      routed_for_release: "boolean"
      released: "boolean"
      dispatched: "boolean"
      manifest_path: "string"
      status: "string"                  # routed | released | dispatched | blocked
      block_reasons: "list"
      carton_id: "string"
    inputs:
      carton_id: "string"
      upstream_yields: "object"
    can_call:
      - agent: "warehouse_manager_human"
        condition: "calling_agent_response.status == 'routed'"
      - agent: "loader_humanoid"
        condition: "calling_agent_response.dispatched == true"
      - agent: "warehouse_audit_logger_agent"
        condition: "always"

  loader_humanoid:
    name: "loader_humanoid"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Humanoid loader — loads a released carton onto the outbound truck."
    yields:
      truck_id: "string"
      loaded_at_utc: "string"
      loaded: "boolean"
    inputs:
      carton_id: "string"
    can_call:
      - agent: "warehouse_audit_logger_agent"
        condition: "calling_agent_response.loaded == true"

  # ─────────────────────────────────────────────────────────────────────────
  # returns_handler_agent — process a returned item (restock / scrap /
  # refurbish). Store-grounded day-0 (agency/returns_handler_agent.py); wire the
  # WMS returns module via the commented mcp block.
  # ─────────────────────────────────────────────────────────────────────────
  returns_handler_agent:
    name: "returns_handler_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Process returned items — restock / scrap / refurbish (store-grounded day-0)."
    yields:
      return_status: "string"            # restocked | scrapped | refurbish
      restocked_units: "number"
      available: "boolean"
    inputs:
      payload: "object"
    # A programmatic agent takes its connector as `integration:` +
    # `connector_config:` (an `mcp:` list is refused on agent_type
    # programmatic). The connector's response is handed to this agent's
    # Python body as its first argument — adapt the body before uncommenting.
    # integration: mcp
    # connector_config:
    #   connection: wms_mcp   # vault connection holds the URL + token
    #   transport: http
    #   tool_name: process_return
    #   timeout: 30
    can_call:
      - agent: "inventory_agent"
        condition: "calling_agent_response.return_status == 'restocked'"
      - agent: "warehouse_audit_logger_agent"
        condition: "always"

  # ═════════════════════════════════════════════════════════════════════════
  # inventory_control_agent — cycle counts, ingest, shrink reconciliation.
  # PARALLEL COPIES (scaling.copies): a nightly sweep fans out into copies, each
  # claiming a DISJOINT batch of SKUs via the atomic claim
  # (agency/_shared/store.claim_count_batch) so copies split the backlog instead
  # of duplicating it. copies.handoff: last combines the copies — counts SUM
  # (correct: skus_counted / over_tolerance_count are additive). The per-copy
  # @chain enforce_shrink_floor re-asserts the 2% tolerance + manager-attention
  # floor on its OWN batch; the combined max_variance_pct is a summed ratio, so
  # it is CONSERVATIVE (it can only over-escalate the `> 0.02` wire — fail-safe,
  # never a missed shrink). wake_up runs the sweep in the warehouse timezone (NOT
  # UTC). See agency/inventory_control_agent.py.
  # ═════════════════════════════════════════════════════════════════════════
  inventory_control_agent:
    name: "inventory_control_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Inventory control — cycle counts, ingest, reconciliation; parallel-instance sweep; shrink floor."
    scaling:                      # 2.4.484 (was instances / instances_handoff)
      copies:
        mode: fixed
        count: 3
        handoff: last
    wake_up: "0 3 * * *"
    timezone: "America/Denver"
    wake_up_input:
      trigger: cycle_count_scheduled
      mode: count
    yields:
      mode: "string"                     # count | ingest | report
      skus_counted: "number"
      variance_skus: "list"
      max_variance_pct: "number"
      total_counts: "number"
      over_tolerance_count: "number"
      over_tolerance: "list"
      systematic_short_zones: "list"
      systematic_short_zone_count: "number"
      total_variance_units: "number"
      requires_manager_action: "boolean"
      recon_briefing: "string"
    inputs:
      trigger: "string"
      mode: "string"
      sku: "string"
      zone: "string"
      bin: "string"
      system_qty: "number"
      physical_qty: "number"
      counter_id: "string"
    # A programmatic agent takes its connector as `integration:` +
    # `connector_config:` (an `mcp:` list is refused on agent_type
    # programmatic). The connector's response is handed to this agent's
    # Python body as its first argument — adapt the body before uncommenting.
    # integration: mcp
    # connector_config:
    #   connection: wms_mcp   # vault connection holds the URL + token
    #   transport: http
    #   tool_name: get_cycle_count_results
    #   timeout: 30
    can_call:
      - agent: "exception_agent"
        condition: "calling_agent_response.max_variance_pct > 0.02"
      - agent: "warehouse_manager_human"
        condition: "calling_agent_response.systematic_short_zone_count > 0 or calling_agent_response.over_tolerance_count > 20"
      - agent: "warehouse_audit_logger_agent"
        condition: "always"
    auto_store_response: true
    auto_store_yields: true

  # ─────────────────────────────────────────────────────────────────────────
  # replenishment_planner_agent — reorder recommendations off the SKU master.
  # Store-grounded day-0 (agency/replenishment_planner_agent.py); wire the ERP
  # via the commented mcp block. Critical stockout -> Ops Supervisor.
  # ─────────────────────────────────────────────────────────────────────────
  replenishment_planner_agent:
    name: "replenishment_planner_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Reorder recommendations off the SKU master (store-grounded day-0); critical-stockout floor."
    yields:
      mode: "string"
      total_skus: "number"
      reorder_recommendations: "list"
      critical_stockout_count: "number"
      replenishment_briefing: "string"
      available: "boolean"
    inputs:
      mode: "string"
      sku: "string"
      description: "string"
      qty_on_hand: "number"
      reorder_point: "number"
      target_qty: "number"
      lead_time_days: "number"
      supplier_id: "string"
      delta: "number"
    # ── Wire the real ERP/SRM: create the vault connection 'erp_mcp' on
    #    Infrastructure → Integrations → MCP (or an "Add custom" record, service
    #    type Tools), then uncomment — here before the first start, in Studio's
    #    YAML editor after it (applies live, no restart). ──
    # A programmatic agent takes its connector as `integration:` +
    # `connector_config:` (an `mcp:` list is refused on agent_type
    # programmatic). The connector's response is handed to this agent's
    # Python body as its first argument — adapt the body before uncommenting.
    # integration: mcp
    # connector_config:
    #   connection: erp_mcp   # vault connection holds the URL + token
    #   transport: http
    #   tool_name: get_reorder_recommendations
    #   timeout: 30
    can_call:
      - agent: "ops_supervisor_human"
        condition: "calling_agent_response.critical_stockout_count > 0"
      - agent: "warehouse_audit_logger_agent"
        condition: "always"
    auto_store_response: true
    auto_store_yields: true

  # ═════════════════════════════════════════════════════════════════════════
  # supplier_relations_agent — ONE supplier relationship manager, three
  # responsibilities (onboarding + sourcing + quarterly scorecards). SUPER-AGENT
  # (plan -> execute -> verify -> reflect) fits the trend reasoning over trailing
  # scorecards. @pre_compose pulls the scorecard + performance HISTORY so it
  # grades real data. Playbook = the per-responsibility craft, fetched on demand;
  # tools are on-demand dev-store lookups that announce available:false with no
  # ERP wired. The onboarding/sourcing FLOORS are duplicated on the wires.
  # See agency/supplier_relations_agent.py + agency/tools.py.
  # ═════════════════════════════════════════════════════════════════════════
  supplier_relations_agent:
    name: "supplier_relations_agent"
    agent_type: "llm"
    communication_type: "chain"
    model: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 2000
    max_tool_calls_per_message: 12   # onboarding+sourcing can chain several lookups; default 5 truncates silently
    description: "Supplier relationship manager — onboarding gates, alternate sourcing, quarterly scorecards."
    super_agent:                     # DICT form = the tuning path (2.4.123+); the ONLY way to tune it
      cost_ceiling: 100000
      wall_clock: 600
    wake_up: "0 9 1 1,4,7,10 *"       # Quarterly first-of-month 09:00 — scorecard responsibility
    timezone: "America/Denver"        # crons run in UTC without this (gotcha #13)
    tools: [lookup_supplier, find_alternates]
    tool_categories: [supplier]
    prompt: |
      You are the supplier relationship manager for this warehouse. One role,
      three responsibilities. An explicit "mode" in the input always wins;
      otherwise infer it (supplier_signals/period -> scorecard; sku/category ->
      sourcing; supplier_id -> onboarding; an empty scheduled tick -> scorecard
      with neutral values). Return ONE JSON object. Use empty / neutral values
      for the responsibilities that don't apply, and keep ALL routing flags false
      for inactive responsibilities — fail closed.

      Load the `supplier_playbook` for the exact onboarding / sourcing /
      scorecard rules. Use lookup_supplier / find_alternates for on-demand
      lookups the pulled context did not already carry. steps_complete,
      steps_remaining and suppliers_requiring_action are lists of ids; each
      shortlist item is {"supplier_id", "lead_time_days", "preferred"}; each
      scorecards item is {"supplier_id", "grade", "requires_action"}.

      OUTPUT CONTRACT — respond with ONLY valid JSON containing exactly these keys:
      {"mode": "", "supplier_id": "", "legal_name": "", "category": "", "status": "", "rejection_reason": "", "steps_complete": [], "steps_remaining": [], "esg_risk": "", "kyc_status": "", "banking_verified": false, "insurance_required": false, "insurance_provided": false, "requires_procurement_lead_approval": false, "requires_compliance_review": false, "updated_at_utc": "", "run_id": "", "sku": "", "reason": "", "preferred_count": 0, "market_count": 0, "shortlist": [], "shortlist_size": 0, "requires_rfq": false, "requires_procurement_lead": false, "no_qualified_alternates": false, "generated_at_utc": "", "period": "", "scorecards": [], "scorecard_count": 0, "suppliers_requiring_action": [], "action_count": 0, "requires_procurement_lead_review": false}
    playbook:
      - intent: supplier_playbook
        description: "The onboarding gates, sourcing ranking, and scorecard grade bands."
        responsibility: |
          ONBOARDING (mode: onboarding): never mark a step complete without
          evidence in the input; pending is the default. No supplier_id ->
          status in_progress, rejection_reason no_supplier_id, all flags false.
          kyc_status rejected -> status rejected, requires_compliance_review true.
          esg_risk high -> status rejected, requires_compliance_review true.
          Insurance required for construction / logistics / professional_services
          / technology. status approved ONLY when every gate passes; then
          requires_procurement_lead_approval true (final human sign-off).

          SOURCING (mode: sourcing): missing sku/category -> reason missing_keys,
          no_qualified_alternates false (a skip is NOT "no alternates"). Only
          candidates whose categories include the requested one and whose esg_risk
          meets the floor (low->low; medium->low|medium; default medium). Rank by
          lead time then reliability; preferred beats market (max 3). requires_rfq
          when only market candidates qualify. requires_procurement_lead when the
          shortlist is non-empty; no_qualified_alternates true only when sku+
          category were given and the shortlist is empty. Never invent on-time %.

          SCORECARDS (mode: scorecard): the MATH is computed upstream — never
          recompute or invent. Grade on composite_score: A>=0.85, B>=0.70,
          C>=0.55, D<0.55. requires_action when on_time_pct<0.85 OR defect_ppm>
          1000 OR response_hours_median>24 OR esg_compliance not current OR grade
          D. requires_procurement_lead_review when ANY supplier requires action.
          No supplier_signals -> neutral empties, all flags false.
        variables: [mode, supplier_id, sku, category]
    narration: >
      If a scorecard narrative reveals a quality slide on goods currently moving
      through this warehouse (rising defect PPM on active SKUs), consider
      exception_agent so the floor starts inspecting inbound lots before the
      quarterly review lands.
    enforce_yields: true
    yields:
      mode: "string"
      supplier_id: "string"
      legal_name: "string"
      category: "string"
      status: "string"
      rejection_reason: "string"
      steps_complete: {type: array, items: string}
      steps_remaining: {type: array, items: string}
      esg_risk: "string"
      kyc_status: "string"
      banking_verified: "boolean"
      insurance_required: "boolean"
      insurance_provided: "boolean"
      requires_procurement_lead_approval: "boolean"
      requires_compliance_review: "boolean"
      updated_at_utc: "string"
      run_id: "string"
      sku: "string"
      reason: "string"
      preferred_count: "number"
      market_count: "number"
      shortlist: {type: array, items: {type: object, fields: {supplier_id: string, lead_time_days: number, preferred: boolean}}}
      shortlist_size: "number"
      requires_rfq: "boolean"
      requires_procurement_lead: "boolean"
      no_qualified_alternates: "boolean"
      generated_at_utc: "string"
      period: "string"
      scorecards: {type: array, items: {type: object, fields: {supplier_id: string, grade: string, requires_action: boolean}}}
      scorecard_count: "number"
      suppliers_requiring_action: {type: array, items: string}   # supplier ids
      action_count: "number"
      requires_procurement_lead_review: "boolean"
    inputs:
      upstream_yields: "object"
      mode: "string"
      supplier_id: "string"
      sku: "string"
      category: "string"
      reason: "string"
      esg_floor: "string"
      supplier_signals: "list"
      period: "string"
    can_call:
      - agent: "warehouse_manager_human"
        condition: "calling_agent_response.requires_procurement_lead_approval == true"
      - agent: "warehouse_manager_human"
        condition: "calling_agent_response.requires_compliance_review == true"
      - agent: "warehouse_manager_human"
        condition: "calling_agent_response.esg_risk == 'high'"
      - agent: "warehouse_manager_human"
        condition: "calling_agent_response.kyc_status == 'rejected'"
      - agent: "warehouse_manager_human"
        condition: "calling_agent_response.requires_procurement_lead == true"
      - agent: "exception_agent"
        condition: "calling_agent_response.no_qualified_alternates == true"
      - agent: "warehouse_manager_human"
        condition: "calling_agent_response.requires_procurement_lead_review == true"
    auto_store_response: true
    auto_store_yields: true

  # humanoid_status_agent — humanoid fleet telemetry (battery / fault / location).
  humanoid_status_agent:
    name: "humanoid_status_agent"
    agent_type: "programmatic"
    communication_type: "chain"
    description: "Humanoid fleet telemetry — battery / fault / location (store-grounded; fleet-API swap in PROD)."
    yields:
      total_units: "number"
      offline_units: "number"
      low_battery_units: "number"
      fault_alerts: "list"               # [{unit_id, fault_code, severity}]
    inputs:
      payload: "object"
    can_call:
      - agent: "ops_supervisor_human"
        condition: "calling_agent_response.fault_alerts != []"
      - agent: "warehouse_audit_logger_agent"
        condition: "always"

  # ═════════════════════════════════════════════════════════════════════════
  # HUMAN members — first-class, answering in Studio's Inbox. Timeouts follow
  # the floor: the Ops Supervisor answers a floor exception within 30 min; the
  # Warehouse Manager answers a dispatch release within 2h, inside the same
  # day's carrier cut-off.
  # If nobody answers in time, the request waits no longer: its Inbox card
  # closes and the ticket records that no reply came. Nothing is released or
  # approved on silence, and nobody is chased automatically. fallback_on_timeout
  # / fallback_response state the intended default-deny (held_for_review ->
  # audit); leafmesh 2.4.486 does not route it for these dual seats yet.
  # Every value a seat asks for has a route. `dual` belongs on the human
  # boundary agent ONLY; they never call each other (a dual->dual edge
  # auto-bounces — gotcha #17). The supervisor's "escalate" goes to the
  # Coordinator, which hands it to the Warehouse Manager.
  # ═════════════════════════════════════════════════════════════════════════
  ops_supervisor_human:
    name: "ops_supervisor_human"
    agent_type: "human"
    human_interface: "default"   # the Inbox (no vault connection needed)
    communication_type: "dual"
    human_timeout_seconds: 1800          # 30 min — floor exceptions need fast response
    description: "Ops Supervisor — floor decisions, exceptions, safety, humanoid faults."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
      message: held_for_review
    yields:
      human_message: "string"            # resolved | escalate | held_for_review
    inputs:
      order_id: "string"
      exception: "object"
    can_call:
      # Beyond the supervisor's authority → the Coordinator, which escalates it
      # to the Warehouse Manager (a human never calls a human directly).
      - agent: "fulfillment_coordinator_agent"
        condition: "calling_agent_response.human_message == 'escalate'"
      - agent: "warehouse_audit_logger_agent"
        condition: "calling_agent_response.human_message == 'resolved' or calling_agent_response.human_message == 'held_for_review'"

  warehouse_manager_human:
    name: "warehouse_manager_human"
    agent_type: "human"
    human_interface: "default"   # the Inbox (no vault connection needed)
    communication_type: "dual"
    human_timeout_seconds: 7200          # 2 h — a dispatch release must clear the day's carrier cut-off
    description: "Warehouse Manager — accountable owner: dispatch release of a $500+ carton, supplier gates, systematic shrink."
    fallback_on_timeout: true
    fallback_response:
      human_decision: held
      human_message: held_for_review
      message: held_for_review
    yields:
      human_message: "string"            # approved | rejected | held_for_review
    inputs:
      order_id: "string"
      carton_id: "string"
    can_call:
      # A dispatch release the dispatcher asked for → back to the dispatcher.
      - agent: "shipment_dispatcher_agent"
        condition: "calling_agent_response.human_message == 'approved' and calling_agent_response.from_agent == 'shipment_dispatcher_agent'"
      # Every other approval (supplier gate, shrink, escalation) is a decision
      # on record; rejected / held are recorded too. Nothing ships from here.
      - agent: "warehouse_audit_logger_agent"
        condition: "(calling_agent_response.human_message == 'approved' and calling_agent_response.from_agent != 'shipment_dispatcher_agent') or calling_agent_response.human_message == 'rejected' or calling_agent_response.human_message == 'held_for_review'"

  # ═════════════════════════════════════════════════════════════════════════
  # WORM audit sink — hash-chained, append-only, the terminus of every path.
  # Registered in main.py via leafmesh.intelligence("warehouse_audit_logger_agent").
  # ═════════════════════════════════════════════════════════════════════════
  warehouse_audit_logger_agent:
    name: "warehouse_audit_logger_agent"
    agent_type: "external"
    framework: "custom"
    communication_type: "chain"
    description: "WORM audit — hash-chains every pick, pack, ship, exception, humanoid action, and held gate. Terminus."
    connector_config:
      sink_type: "local_file"
      local_file_path: "./logs/warehouse_audit.jsonl"
    yields:
      audit_event_id: "string"
      written_at_utc: "string"
      hash_chain_prev: "string"
      hash_chain_current: "string"
    inputs:
      session_id: "string"
      payload: "object"
    can_call: []
